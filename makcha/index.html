<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>막차: 지하 생존기</title>
<style>
:root{--bg:#0d0f12;--panel:rgba(12,14,18,.78);--ink:#ece6d6;--sub:#a59f90;--acc:#e0b04a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;overflow:hidden;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;pointer-events:none}
.bars{background:var(--panel);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 10px;display:grid;gap:5px;width:clamp(200px,22vw,320px)}
.bar{height:clamp(14px,1.7vw,22px);background:rgba(0,0,0,.6);border-radius:5px;position:relative;overflow:hidden}
.bar i{display:block;height:100%}.bar span{position:absolute;inset:0;text-align:center;font-size:clamp(11px,1.2vw,15px);font-weight:800;line-height:clamp(14px,1.7vw,22px);text-shadow:0 0 3px #000}
#hp i{background:#d84a3a}#sh i{background:#8aa8c8}#en i{background:#5ab0e0}
#where{background:var(--panel);border-radius:10px;padding:4px 10px;font-size:14px;align-self:flex-start}
#loadout{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
#loadout[hidden]{display:none}
.wslots{display:grid;gap:5px;min-width:clamp(170px,17vw,240px)}
.ws{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid rgba(255,255,255,.12);border-radius:9px;padding:5px 9px;font-size:clamp(13px,1.3vw,16px);font-weight:700}
.ws.on{border-color:var(--acc);background:rgba(224,176,74,.22)}.ws canvas{image-rendering:pixelated;width:40px;height:22px}.ws small{display:block;font-weight:400;color:var(--sub);font-size:.78em}
.whelp{font-size:12px;color:var(--sub);text-align:right}#pickhint{font-size:13px;color:#ffe9a0;font-weight:700;text-align:right}
.skill{width:clamp(70px,7vw,96px);height:clamp(70px,7vw,96px);border-radius:50%;background:var(--panel);border:3px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(12px,1.2vw,15px);position:relative;overflow:hidden}
.skill i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6)}.skill b,.skill span{position:relative}.skill span{font-size:.85em;color:var(--acc)}.skill.cd{border-color:#5a5f68}.skill.cd span{color:#ffb070}
#tip{position:fixed;left:50%;top:clamp(56px,7vw,84px);transform:translateX(-50%);max-width:min(70vw,720px);text-align:center;background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:8px 14px;font-size:clamp(14px,1.4vw,18px);opacity:0;transition:opacity .3s;pointer-events:none}
#tip.on{opacity:1}
#status{display:flex;flex-wrap:wrap;gap:4px}#status:empty{display:none}#status span{background:rgba(0,0,0,.55);border:1px solid;border-radius:6px;padding:1px 6px;font-size:clamp(11px,1.1vw,14px);font-weight:800}
.pop{position:fixed;transform:translate(-50%,0);font-size:clamp(18px,2.4vw,30px);font-weight:900;text-shadow:0 0 4px #000,0 2px 0 #000;pointer-events:none;animation:popup 1.3s ease-out forwards;white-space:nowrap;z-index:5}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-50px)}}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:46vh;overflow:auto}
.relic{display:inline-flex;flex-direction:column;background:#262a33;border:2px solid;border-radius:8px;padding:5px 8px;cursor:pointer;font-size:13px;min-width:120px}.relic small{color:var(--sub);font-size:11px}
.relic[data-on]{background:rgba(224,176,74,.25);box-shadow:0 0 0 2px var(--acc)}.relic.unknown{cursor:default;opacity:.6}
.gres{background:#262a33;border:3px solid;border-radius:10px;padding:8px 14px;animation:popup2 .5s ease-out}@keyframes popup2{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,9,12,.88)}
#menu[hidden]{display:none}
.card{background:#1c1f26;border:1px solid #333842;border-radius:12px;padding:20px;max-width:900px;width:92vw}
.card h1{margin:0 0 6px;font-size:26px}.card p{color:var(--sub);margin:4px 0 12px;line-height:1.5}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.job{background:#262a33;border:2px solid transparent;border-radius:10px;padding:10px;color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.job:hover,.job:focus{border-color:var(--acc);outline:none}
.job canvas{width:76px;height:96px;margin:0 auto 6px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="640" height="360"></canvas></div>
<div id="hud" hidden>
  <div class="bars"><div class="bar" id="hp"><i></i><span></span></div><div class="bar" id="sh"><i></i><span></span></div><div class="bar" id="en"><i></i><span></span></div><div id="status"></div></div>
  <div id="where"></div>
</div>
<div id="loadout" hidden><div class="wslots"><div id="pickhint"></div><div id="wslots"></div><div class="whelp">Q 바꾸기 · E 줍기 · <span id="parts"></span></div></div>
  <div class="skill" id="skill"><i id="skillFill"></i><b id="skillName"></b><span id="skillCd"></span></div></div>
<div id="tip"></div>
<div id="menu"><div class="card" id="card"></div></div>
<script type="module" src="client/main.js"></script>
</body>
</html>
